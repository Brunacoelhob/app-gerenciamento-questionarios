<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Questionários Tech</title>

    <!-- 1. Fonte Inter (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- 2. Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 3. Ícones: Bootstrap Icons & Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- 4. Animate.css (Animações CSS) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <!-- 5. Estilos Customizados (Design System Tech Clean) -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Fundo Animado com Vanta.js -->
    <div id="vanta-bg" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;"></div>

    <div class="content-wrapper">
        <!-- CABEÇALHO PRINCIPAL -->
        <header class="cabecalho-principal">
            <h1>
                <i class="bi bi-patch-question-fill"></i>
                <span>Questionários</span>
            </h1>

            <nav class="menu-navegacao" id="menu-navegacao">
                <button class="btn-aba active" data-aba="aba-banco-perguntas">
                    <i class="bi bi-card-checklist me-1"></i> Banco de Perguntas
                </button>
                <button class="btn-aba" data-aba="aba-formularios">
                    <i class="bi bi-folder-plus me-1"></i> Formulários
                </button>
                <button class="btn-aba" data-aba="aba-respostas">
                    <i class="bi bi-pencil-square me-1"></i> Responder
                </button>
                <button class="btn-aba" data-aba="aba-listar-respostas">
                    <i class="bi bi-bar-chart-line me-1"></i> Respostas
                </button>
            </nav>
        </header>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="conteudo-principal">

            <!-- 1. BANCO DE PERGUNTAS -->
            <section id="aba-banco-perguntas" class="secao-aba aba-conteudo">
                <h2><i class="bi bi-plus-circle me-2"></i>Cadastrar / Editar Pergunta</h2>

                <form id="form-pergunta" class="formulario-cadastro">
                    <!-- Campo oculto para armazenar o ID ao editar uma pergunta -->
                    <input type="hidden" id="pergunta-id-edicao" value="">

                    <div class="grupo-campo">
                        <label for="enunciado">Enunciado da Pergunta *</label>
                        <input type="text" class="campo-input" id="enunciado"
                            placeholder="Ex: Qual o seu nível de satisfação?" maxlength="200" required>
                        <small class="text-muted fs-7">Limite máximo de 200 caracteres para o enunciado.</small>
                    </div>

                    <div class="grupo-campo">
                        <label for="tipo-pergunta">Tipo de Pergunta *</label>
                        <select class="campo-select" id="tipo-pergunta" required>
                            <option value="" selected disabled>Selecione o tipo...</option>
                            <option value="texto_curto">Texto curto (Até 200 caracteres)</option>
                            <option value="texto_longo">Texto longo (Caixa de texto expansível)</option>
                            <option value="multipla_escolha">Múltipla escolha (2 a 10 opções - Seleção Única)</option>
                            <option value="checkbox">Checkbox (3 a 15 opções - Múltipla Seleção)</option>
                        </select>
                    </div>

                    <!-- Container Dinâmico de Alternativas -->
                    <div id="container-alternativas" class="painel-alternativas d-none">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <label class="mb-0 fw-semibold text-info" id="label-tipo-alternativa">
                                <i class="bi bi-list-check me-1"></i> Alternativas *
                            </label>
                            <button type="button" class="btn-secundario" id="btn-add-alternativa">
                                <i class="fa-solid fa-plus me-1"></i> Adicionar Opção
                            </button>
                        </div>
                        <div id="lista-inputs-alternativas" class="d-flex flex-column gap-2"></div>
                    </div>

                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn-primario" id="btn-salvar-pergunta">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Salvar Pergunta
                        </button>
                        <button type="button" class="btn-secundario d-none" id="btn-cancelar-edicao"
                            onclick="cancelarEdicaoPergunta()">
                            <i class="fa-solid fa-xmark me-1"></i> Cancelar Edição
                        </button>
                    </div>
                </form>

                <hr class="divisor my-4">

                <h2><i class="bi bi-journal-text me-2"></i>Perguntas Cadastradas no Banco</h2>
                <ul id="lista-banco-perguntas" class="lista-itens ps-0">
                    <!-- Injetado via JS -->
                </ul>
            </section>

            <!-- 2. GESTÃO DE FORMULÁRIOS -->
            <section id="aba-formularios" class="secao-aba aba-conteudo d-none">
                <h2><i class="bi bi-file-earmark-plus"></i>Criar / Editar Formulário</h2>

                <form id="form-criar-formulario" class="formulario-cadastro">
                    <div class="grupo-campo">
                        <label for="titulo-form">Título do Formulário *</label>
                        <input type="text" class="campo-input" id="titulo-form"
                            placeholder="Ex: Pesquisa de Clima Organizacional" required>
                    </div>

                    <div class="grupo-campo">
                        <label for="descricao-form">Descrição</label>
                        <textarea class="campo-textarea" id="descricao-form" rows="3"
                            placeholder="Escreva uma breve explicação..."></textarea>
                    </div>

                    <div class="grupo-campo-duplo">
                        <div class="grupo-campo">
                            <label for="data-inicio">Data e Hora de Início</label>
                            <input type="datetime-local" class="campo-input" id="data-inicio">
                        </div>
                        <div class="grupo-campo">
                            <label for="data-fim">Data e Hora de Fim</label>
                            <input type="datetime-local" class="campo-input" id="data-fim">
                        </div>
                    </div>

                    <div class="grupo-campo">
                        <label for="status-form">Status *</label>
                        <select class="campo-select" id="status-form" required>
                            <option value="rascunho">Rascunho</option>
                            <option value="publicado">Publicado</option>
                            <option value="encerrado">Encerrado</option>
                        </select>
                    </div>

                    <div class="grupo-campo">
                        <label>Selecione as Perguntas (Mínimo 1) *</label>
                        <div id="selecao-perguntas-banco" class="painel-alternativas">
                            <!-- Checkboxes via JS -->
                        </div>
                    </div>

                    <button type="submit" class="btn-primario">
                        <i class="bi bi-save me-1"></i> Salvar Formulário
                    </button>
                </form>

                <hr class="divisor my-4">

                <h2><i class="bi bi-collection"></i>Formulários Cadastrados</h2>
                <div id="lista-formularios" class="lista-cards">
                    <!-- Cards via JS -->
                </div>
            </section>

            <!-- 3. RESPONDER FORMULÁRIO -->
            <section id="aba-respostas" class="secao-aba aba-conteudo d-none">
                <h2><i class="bi bi-pencil-square"></i>Responder Formulário</h2>

                <form id="form-submeter-resposta" class="formulario-resposta">
                    <!-- Seleção do Formulário -->
                    <div class="grupo-campo mb-4">
                        <label for="resposta-id-formulario">Selecione o Formulário *</label>
                        <select id="resposta-id-formulario" class="campo-select flex-grow-1" required>
                            <option value="">-- Selecione um Formulário --</option>
                        </select>
                    </div>

                    <!-- Identificação do Usuário -->
                    <div class="grupo-campo-duplo mb-3">
                        <div class="grupo-campo">
                            <label for="resposta-nome">Seu Nome *</label>
                            <input type="text" class="campo-input" id="resposta-nome" placeholder="Ex: João Silva"
                                required>
                        </div>
                        <div class="grupo-campo">
                            <label for="resposta-email">Seu E-mail *</label>
                            <input type="email" class="campo-input" id="resposta-email" placeholder="Ex: joao@email.com"
                                required>
                        </div>
                    </div>

                    <hr class="divisor my-4">

                    <!-- Perguntas Renderizadas Dinamicamente -->
                    <div id="container-perguntas-formulario" class="d-flex flex-column gap-3 mb-4"></div>

                    <button type="submit" id="btn-enviar-resposta" class="btn-destaque w-100">
                        <i class="bi bi-send me-1"></i> Enviar Respostas
                    </button>
                </form>
            </section>

            <!-- 4. VISUALIZAÇÃO DE RESPOSTAS (ADMIN) -->
            <section id="aba-listar-respostas" class="secao-aba aba-conteudo d-none">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="mb-0"><i class="bi bi-bar-chart-line"></i>Respostas Recebidas</h2>
                    <span id="total-respostas-badge" class="badge-status badge-publicado fs-6">0 respostas</span>
                </div>

                <div class="grupo-campo mb-4">
                    <label for="select-filtro-formulario-respostas">Selecione o Questionário:</label>
                    <select id="select-filtro-formulario-respostas" class="campo-select">
                        <option value="" selected disabled>Carregando formulários...</option>
                    </select>
                </div>

                <div id="container-tabela-respostas">
                    <p class="text-muted text-center my-4">Selecione um formulário acima para listar suas respostas.</p>
                </div>
            </section>

        </main>
    </div>

    <!-- SCRIPTS EXTERNOS DE BIBLIOTECAS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.net.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>

    <!-- SCRIPTS MÓDULOS DO PROJETO (Ordem Crítica) -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/fundo.js"></script>
    <script src="js/banco-perguntas.js"></script>
    <script src="js/formularios.js"></script>
    <script src="js/respostas.js"></script>
    <script src="js/listar-respostas.js"></script>

    <!-- Script Principal (Por último) -->
    <script src="js/app.js"></script>
</body>

</html>
